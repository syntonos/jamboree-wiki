<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Laser tag concept diagram</title><desc id="desc">Conceptual starter diagram. Component choices and interfaces are not verified.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#bcd9ff"/></marker></defs><rect width="760" height="430" fill="#103e74"/><rect width="760" height="430" fill="url(#grid)"/><g font-family="monospace"><text x="35" y="42" fill="#fff" font-size="21">Laser tag</text><text x="35" y="65" fill="#bcd9ff" font-size="11">CONCEPT ONLY / INTERFACES AND PARTS TBD</text><path d="M235 160L280 160" stroke="#bcd9ff" fill="none" marker-end="url(#arrow)"/><path d="M480 160L525 160" stroke="#bcd9ff" fill="none" marker-end="url(#arrow)"/><path d="M380 260L380 210" stroke="#bcd9ff" fill="none" marker-end="url(#arrow)"/><path d="M480 160L525 310" stroke="#bcd9ff" fill="none" marker-end="url(#arrow)"/><g transform="translate(35 110)"><rect width="200" height="100" rx="3" fill="#154b89" stroke="#bcd9ff"/><text x="14" y="29" fill="#fff" font-size="14">Power</text><text x="14" y="57" fill="#bcd9ff" font-size="10"><tspan x="14" dy="0">Voltage and current budget</tspan><tspan x="14" dy="16">TBD</tspan></text></g><g transform="translate(280 110)"><rect width="200" height="100" rx="3" fill="#154b89" stroke="#bcd9ff"/><text x="14" y="29" fill="#fff" font-size="14">Controller</text><text x="14" y="57" fill="#bcd9ff" font-size="10"><tspan x="14" dy="0">Protocol and scoring logic</tspan></text></g><g transform="translate(525 110)"><rect width="200" height="100" rx="3" fill="#154b89" stroke="#bcd9ff"/><text x="14" y="29" fill="#fff" font-size="14">IR transmitter</text><text x="14" y="57" fill="#bcd9ff" font-size="10"><tspan x="14" dy="0">Emitter and driver TBD</tspan></text></g><g transform="translate(280 260)"><rect width="200" height="100" rx="3" fill="#154b89" stroke="#bcd9ff"/><text x="14" y="29" fill="#fff" font-size="14">IR receiver</text><text x="14" y="57" fill="#bcd9ff" font-size="10"><tspan x="14" dy="0">Detection and decoding</tspan></text></g><g transform="translate(525 260)"><rect width="200" height="100" rx="3" fill="#154b89" stroke="#bcd9ff"/><text x="14" y="29" fill="#fff" font-size="14">Feedback</text><text x="14" y="57" fill="#bcd9ff" font-size="10"><tspan x="14" dy="0">Indicators or sound TBD</tspan></text></g><text x="35" y="401" fill="#bcd9ff" font-size="11">JAMBOREE / STARTER RESOURCE / NOT A BUILD-READY DESIGN</text></g></svg>
